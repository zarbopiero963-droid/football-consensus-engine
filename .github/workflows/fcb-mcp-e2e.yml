name: FCB MCP E2E on the real Render deployment (OAuth + MCP, read-only)

# Manual only, owner only, from main only, after the mcp-e2e Environment approval.
# Plays a public PKCE client against the pinned production origin: OAuth (DCR, consent,
# code, refresh), MCP initialize / tools/list / tools/call on two zero-cost local tools,
# plus negative tests. No browser tool, no SX Bet order. With the default suite `health`:
# no provider request and no artifact (unchanged behaviour).
# Opt-in suites `apifootball` / `apifootball_full` / `apifootball_completion`: read-only
# apifootball_* tools through the same MCP session (hence the server's shared quota coordinator),
# under a hard, fail-closed budget of provider HTTP attempts per campaign, every provider call
# charged its worst case (3). The budget input is capped by the owner-approved ceilings in
# scripts/mcp_e2e_render.py (45 for apifootball_completion, 20 for the other two): raising one is
# an owner-merged PR that changes those constants and their pinning tests, never a dispatch
# input. Any suite verdict other than PASS fails the job. Those suites upload one
# small, leak-checked JSON (shapes, counts, ids, hashes; no prices, no raw payloads).
# The password lives only in the memory of the E2E step; it is never printed or saved.
# The E2E client is standard-library only: no package is installed next to the password.
# FCB-WP-009 (R2): the run name records the database identity the run asserted, so the roles
# workflow (phase 2) can verify through the GitHub API that a successful run on the same main
# commit proved the deployed runtime connects as fcb_app (inputs are not exposed by the API).
run-name: "FCB MCP E2E (expected database identity: ${{ inputs.expected_db_identity || 'none' }})"
on:
  workflow_dispatch:
    inputs:
      expected_db_identity:
        description: "WP-009 cutover only: fail unless the runtime's database identity is this role"
        type: choice
        options: ['', fcb_app]
        default: ''
      suite:
        description: "health = zero provider calls (default); apifootball = prioritized plan; apifootball_full = one call per provider tool; apifootball_completion = only what is still unproven"
        type: choice
        options: [health, apifootball, apifootball_full, apifootball_completion]
        default: health
      apifootball_budget:
        description: "Max real API-FOOTBALL HTTP attempts for this campaign (1-45; 45 is the owner-approved ceiling for apifootball_completion, 20 for the other suites)"
        type: string
        default: '45'

permissions:
  contents: read
  actions: read

concurrency:
  group: fcb-mcp-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # G-02: MCP_OAUTH_PASSWORD lives ONLY in the protected environment mcp-e2e (required
    # reviewer + deployment branch main). The `if:` and the gate step are further layers.
    if: github.ref == 'refs/heads/main'
    environment: mcp-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a protected environment and a trusted dispatch (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          # Fails closed on any API/JSON error, a missing reviewer or a missing main-only branch policy.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" mcp-e2e)"
          echo "## Gate: environment mcp-e2e protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: E2E against the real deployment (password in memory only)
        env:
          MCP_OAUTH_PASSWORD: ${{ secrets.MCP_OAUTH_PASSWORD }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_DB_IDENTITY: ${{ inputs.expected_db_identity }}
          E2E_SUITE: ${{ inputs.suite }}
          E2E_APIFOOTBALL_BUDGET: ${{ inputs.apifootball_budget }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_OAUTH_PASSWORD:-}" ]; then
            echo "::error::secret MCP_OAUTH_PASSWORD is not set in environment mcp-e2e"; exit 1
          fi
          identity=()
          case "${EXPECTED_DB_IDENTITY:-}" in
            '') ;;
            fcb_app) identity=(--expected-db-identity fcb_app) ;;
            *) echo "::error::unexpected expected_db_identity"; exit 1 ;;
          esac
          suite=()
          case "${E2E_SUITE:-health}" in
            ''|health) ;;
            apifootball|apifootball_full|apifootball_completion)
              # 1..45 only; the script also refuses anything above the suite's owner-approved ceiling.
              case "${E2E_APIFOOTBALL_BUDGET:-}" in
                [1-9]|[1-3][0-9]|4[0-5]) ;;
                *) echo "::error::apifootball_budget must be an integer from 1 to 45"; exit 1 ;;
              esac
              suite=(--suite "$E2E_SUITE" --apifootball-budget "$E2E_APIFOOTBALL_BUDGET"
                     --apifootball-output "$RUNNER_TEMP/apifootball_suite.json") ;;
            *) echo "::error::unexpected suite"; exit 1 ;;
          esac
          python -I scripts/mcp_e2e_render.py --expected-commit "$EXPECTED_COMMIT" "${identity[@]}" \
            "${suite[@]}" --output "$RUNNER_TEMP/mcp_e2e.json"

      - name: Publish the sanitized summary (no secret, no artifact)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "mcp_e2e.json"
          out = Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8")
          if not report.is_file():
              out.write("### MCP E2E\n\nNo report generated.\n")
          else:
              d = json.loads(report.read_text(encoding="utf-8"))
              lines = [f"### MCP E2E on {d.get('target')}: {d.get('verdict')}", "",
                       f"Failed check: {d.get('failed_check')}; checks passed: {d.get('checks_passed')}; "
                       f"tools called: {d.get('tools_called')}; provider/order calls: {d.get('provider_or_order_calls_attempted')}; "
                       f"OAuth rows written: {d.get('oauth_rows_written_per_run')}", "",
                       f"Facts: `{json.dumps(d.get('facts', {}), sort_keys=True)}`", "",
                       "| Check | Outcome |", "|---|---|"]
              lines += [f"| {c.get('check')} | {c.get('outcome')} |" for c in d.get("checks", [])]
              af = d.get("apifootball_suite")
              if isinstance(af, dict):
                  lines += ["", f"### API-FOOTBALL suite {af.get('suite')}: {af.get('verdict')}", "",
                            f"Provider requests charged: {af.get('provider_requests_charged')} of budget "
                            f"{af.get('budget')} (ceiling {af.get('budget_ceiling')}, worst case "
                            f"{af.get('worst_case_per_call')} per call); stop: {af.get('stop_reason')}; "
                            f"plan: `{json.dumps(af.get('plan', {}), sort_keys=True)}`", "",
                            "| Case | Tool | Endpoint | Arguments | Provider status | Outcome | Verdict "
                            "| Reserved/charged | Facts | Defects |",
                            "|---|---|---|---|---|---|---|---|---|---|"]
                  for c in af.get("cases", []):
                      status = c.get("tool_status") or c.get("reason")
                      lines.append(
                          f"| {c.get('id')} | {c.get('tool')} | {c.get('endpoint')} "
                          f"| `{json.dumps(c.get('arguments', {}), sort_keys=True)}` "
                          f"| {status} {c.get('http_status') or ''} {c.get('error_code') or ''} "
                          f"| {c.get('outcome')} | {c.get('verdict')} | {c.get('reserved')}/{c.get('charged')} "
                          f"| `{json.dumps(c.get('facts', {}), sort_keys=True)}` "
                          f"| {', '.join(c.get('defects') or []) or '-'} |")
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload the API-FOOTBALL suite evidence (opt-in suites only; shapes, counts, ids, hashes)
        if: ${{ !cancelled() && inputs.suite != 'health' && inputs.suite != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fcb-mcp-e2e-apifootball-suite
          path: ${{ runner.temp }}/apifootball_suite.json
          if-no-files-found: ignore
          retention-days: 30
