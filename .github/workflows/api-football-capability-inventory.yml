name: api-football-capability-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-football-capability-live
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: api-football-live
    env:
      PYTHONPATH: .
      APIFOOTBALL_ENABLED: 'true'
      APIFOOTBALL_LIVE_AUTHORIZED: 'true'
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
      APIFOOTBALL_MAX_DAILY_REQUESTS: '4'
      APIFOOTBALL_MAX_RPM: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source and regression tests without live calls
        run: python -m pytest -q tests/test_api_football_capability_inventory.py
      - name: Validate configured secret presence without output
        run: test -n "$APIFOOTBALL_API_KEY"
      - name: Bounded live catalog inventory
        run: python scripts/api_football_capability_probe.py
