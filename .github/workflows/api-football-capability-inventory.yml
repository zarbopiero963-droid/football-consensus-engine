name: api-football-capability-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: api-football-live-provider
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G-02: this job receives a production database DSN (shared quota coordinator).
    if: github.ref == 'refs/heads/main'
    environment: api-football-live
    env:
      PYTHONPATH: .
      APIFOOTBALL_ENABLED: 'true'
      APIFOOTBALL_LIVE_AUTHORIZED: 'true'
      # WP-003: shared PostgreSQL quota coordinator (CLAUDE.md §2.4). Configured by the owner
      # in the api-football-live environment; without it the job fails closed before any call.
      # APIFOOTBALL_MAX_* below are checked against the key's SHARED counters (runtime + every
      # workflow, same UTC day/minute), not against this job alone: a job is refused once the
      # key's shared day total reaches its APIFOOTBALL_MAX_DAILY_REQUESTS. Raising it = owner.
      # Secrets (API key, coordinator DSN) are given only to the steps that need them,
      # after the G-02 gate step below.
      APIFOOTBALL_MAX_DAILY_REQUESTS: '60'
      APIFOOTBALL_MAX_RPM: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a protected environment and a trusted dispatch (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          # Fails closed on any API/JSON error, a missing reviewer or a missing main-only branch policy.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" api-football-live)"
          echo "## Gate: environment api-football-live protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source and regression tests without live calls
        run: python -m pytest -q tests/test_api_football_capability_inventory.py tests/test_api_football_five_point_evidence.py tests/test_api_football_five_point_scan.py tests/test_api_football_team_statistics_shape.py tests/test_api_football_half_contract.py tests/test_api_football_full_contract_audit.py tests/test_api_football_39_route_live_reconciliation.py tests/test_api_football_fixture_statistic_values.py
      - name: Validate configured secret presence without output
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        run: test -n "$APIFOOTBALL_API_KEY"
      - name: Coordinator database preflight (fail closed, no value output)
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL// /}" ]; then
            echo 'COORDINATOR_DATABASE_REQUIRED: no live call without the shared quota coordinator'
            exit 1
          fi
      - name: Bounded live catalog inventory
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        run: python scripts/api_football_capability_probe.py --out-dir /tmp/apifootball_capability_evidence
      - name: Publish recoverable evidence ZIP in downloadable job logs
        if: always()
        shell: bash
        run: |
          python scripts/api_football_evidence_log_transport.py --encode /tmp/apifootball_capability_evidence/*.json /tmp/apifootball_capability_evidence/*.csv
      - name: Upload complete sanitized bookmaker and market evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: api-football-catalog-evidence
          path: /tmp/apifootball_capability_evidence/
          if-no-files-found: warn
          retention-days: 7
