name: api-football-contract-check
on:
  pull_request:
    paths: ['bridge/api_football/**','scripts/check_api_football_contracts.py','scripts/verify_api_football_evidence.py','evidence/api_football/**','tests/test_api_football_registry.py','tests/test_api_football_five_point_evidence.py','docs/api_football/**','.github/workflows/api-football-contract-check.yml']
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      APIFOOTBALL_ENABLED: 'false'
      APIFOOTBALL_LIVE_AUTHORIZED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline registry validation and snapshot
        run: python scripts/check_api_football_contracts.py --write /tmp/api-football-registry.json --candidate-evidence docs/api_football/candidate_evidence.json
      - name: Adversarial registry tests
        run: python -m pytest -q tests/test_api_football_registry.py
      - name: Verify historical LIVE 39-route evidence and expose anomalies
        run: python scripts/verify_api_football_evidence.py
      - name: Five-point offline evidence regression
        run: python -m pytest -q tests/test_api_football_five_point_evidence.py
      - name: Assert live gate remains off and no secret enters output
        run: |
          test -z "${APIFOOTBALL_API_KEY:-}"
          test "${APIFOOTBALL_ENABLED}" = false
          test "${APIFOOTBALL_LIVE_AUTHORIZED}" = false
          ! rg -n 'APIFOOTBALL_API_KEY' /tmp/api-football-registry.json
