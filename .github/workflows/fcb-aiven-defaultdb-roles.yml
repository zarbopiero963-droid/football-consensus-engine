name: FCB Aiven defaultdb roles (WP-009, owner-gated)

# FCB-WP-009. Manual only. Creates or updates the least-privilege roles fcb_migrator (LOGIN,
# owns the bridge), fcb_app (LOGIN, runtime allowlist only) and fcb_signer (NOLOGIN, no bridge
# access) in the PRODUCTION database `defaultdb` (Aiven piero-1, PG18), hands the bridge objects
# to fcb_migrator and applies the runtime allowlist. No table, column, row, migration or role
# other than these three is created, dropped or changed; the administrative identity is kept
# (it gains SET + INHERIT membership in fcb_migrator, so the previous DSN keeps working: rollback).
# Gates, all required:
#   1. GitHub Environment `aiven-production` (the restore's), protected: required reviewer and
#      deployment branches = main only (checked by the job itself); started and re-run only by
#      the repository owner (scripts/require_owner_main_dispatch.sh);
#   2. FCB_DEFAULTDB_URL (administrative URI, sslmode=verify-full), FCB_AIVEN_CA_PEM and
#      FCB_AIVEN_CA_SHA256 exist only in that environment; for mode=apply also the owner-set
#      FCB_APP_DB_PASSWORD and FCB_MIGRATOR_DB_PASSWORD (32-128 URL-safe characters, distinct);
#   3. mode=apply AND the exact confirmation phrase; default mode=diagnose never writes (its
#      sessions run with default_transaction_read_only=on);
#   4. pinned target (host/port hashes, database name), PostgreSQL 18, TLS verify-full against
#      the authenticated Aiven CA, pinned SHA-256 of every SQL file the transaction runs;
#   5. read-only prechecks: the restore precheck state is BRIDGE_0001_0008 with no bridge role yet
#      (first run) or the roles model is already HARDENED (re-run); anything else refuses;
#   6. ONE transaction: target guard, in-transaction state guard under the bridge advisory lock
#      (first run: owners/migrations; re-run: model HARDENED, catalog-only), roles, prepare,
#      finalize, object counts (first run), model assertion. After hardening the administrative
#      identity never reads or writes a bridge table in a read-write transaction (fcb_migrator,
#      the owner, could have attached code that would run with its rights): every administrative
#      read of the workflow runs in a read-only transaction;
#      run twice, the second run must leave the same evidence (roles report, schema evidence and the
#      structure fingerprint; owners and ACLs change by design); then both new identities log in
#      over verify-full and are checked read-only.
# Passwords never reach a command line or a log: they are turned into SCRAM-SHA-256 verifiers
# on the runner (masked) and psql reads those from its environment (\getenv). psql stderr is
# printed only after redaction (scripts/fcb_db_roles.py sanitize).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose = read-only report (default); apply = create/update the WP-009 roles and privileges in defaultdb"
        type: choice
        options: [diagnose, apply]
        default: diagnose
      confirm:
        description: "For mode=apply only: type exactly APPLY WP-009 ROLES TO defaultdb"
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  # Shared with the restore workflow: the two never run against defaultdb at the same time.
  group: fcb-aiven-defaultdb-restore
  cancel-in-progress: false

jobs:
  roles:
    # G-02: second layer; the environment (required reviewer + branch main) is the control.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aiven-production
    env:
      EXPECTED_DB: defaultdb
      FCB_DB_URL_VAR: FCB_DEFAULTDB_URL
      CONFIRM_PHRASE: APPLY WP-009 ROLES TO defaultdb
      # SHA-256 of every SQL file the roles transaction and its checks run (tests/test_defaultdb_roles_workflow.py).
      EXPECTED_SQL_SHA256: |
        sql/aiven/roles_apply_guard.sql=4f2468deee4aee9e54ed29f6cb9e783a202e0cc70196da634fcbe1e98332ff83
        sql/aiven/upsert_bridge_roles.sql=d9fcf9a9a3a06945eb30ba9e3456c0d9da8ebdf40be943a213092f81e71ab405
        sql/aiven/prepare_bridge_roles.sql=150c7895f9245d5dca4ba1981310ad8bef782c9ec232ce06a2d66792671a6d0f
        sql/aiven/finalize_bridge_privileges.sql=faaa227c309fbe210e929d82bd1227ab34ba26c3146b521e3837b27b8e8c3476
        sql/aiven/roles_post_checks.sql=625c30fe308ceca1284d5a78979a9419412ba1bd65791b2de907920d901d23e7
        sql/aiven/assert_bridge_counts.sql=aee4b5378ce4c0ecfd55b6d3461b02cba87cbb0c119afe2e2fc65f6dd450b0b2
        sql/aiven/assert_bridge_roles.sql=74556c7c095b55d3e928b42f24de949b03c595c3f8cada25dc937249e0da3a3c
        sql/aiven/verify_bridge_roles.sql=5ccb277af4bd5066800ef796c6447af3bad7310a61ae653009eb4cd56ebce3c0
        sql/aiven/diagnose_bridge_roles.sql=dacd6365005dad24874ce300a100e788415db0c016bfc79a6f8f3b020c703405
        sql/aiven/verify_bridge_schema.sql=fd063c1d7fee80616647f3f98a42693bbf4a7c77691846d89a8df590e14deb24
        sql/aiven/defaultdb_precheck.sql=d3291db3e7d6cc75ba9e40f34c86f44241f4c883f22d2098d5abfde274311d6d
        sql/aiven/defaultdb_precheck_tracked.sql=e20c845d49a8af61d12975d7756f51a806a8833ffe09b7ef500106143ee5b493
        sql/aiven/fingerprint_bridge_schema.sql=9a04f81ac3fa6a24fb72f0e2e911b76a4c3b33bdeb6f12c8347b674767e36ba8
        sql/aiven/fingerprint_bridge_structure.sql=995ba192e5c8c93b70b484d71f110a3b955a8e1b6b3298db74d6eed557ec092c
      # The restore's pinned catalog fingerprint (PostgreSQL 18): a first apply requires the database to
      # carry exactly it. Owners and ACLs then change BY DESIGN; fingerprint_bridge_structure.sql (the
      # same fingerprint without the owner/ACL fields) must be identical before and after.
      EXPECTED_FINGERPRINT: 'b825ab11029502140b038ce6d3add670'
      # Same pinned object counts as the restore (PostgreSQL 18); they must hold after the roles change.
      EXPECTED_COUNTS: 'tables=33 functions=4 triggers=9 indexes=60 constraints_information_schema=325 constraints_pg_constraint=65 schema_migrations_rows=8'
      PGCONNECT_TIMEOUT: '15'
      # Same Aiven service as fcb-aiven-defaultdb-restore.yml (public values from the Aiven API).
      EXPECTED_HOST_SHA256: 17d6eaa1929aefc16dcdbc6496ab9159944df8b8944e96d1012c555394e8d42b
      EXPECTED_PORT: '14274'
      EXPECTED_PORT_SHA256: e7c3aa32557c7cac5c20f5d28cfa30de75572446ff444407b33670df74475b04
      PGPORT: '14274'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a protected environment (required reviewer), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fails closed on any API/JSON error or a missing/zero reviewer count.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" aiven-production)"
          echo "## Gate: environment aiven-production protected (required reviewers: $reviewers)" >> "$GITHUB_STEP_SUMMARY"

      - name: Mode and confirmation gate
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::the defaultdb roles workflow runs only from main"; exit 1
          fi
          if [ "$TRIGGERING_ACTOR" != "$REPO_OWNER" ] || [ "$ACTOR" != "$REPO_OWNER" ]; then
            echo "::error::only the repository owner may run the defaultdb roles workflow"; exit 1
          fi
          case "$MODE" in
            diagnose) echo "## Mode: diagnose (read-only)" >> "$GITHUB_STEP_SUMMARY" ;;
            apply)
              if [ "$CONFIRM" != "$CONFIRM_PHRASE" ]; then
                echo "::error::mode=apply requires the exact confirmation phrase"; exit 1
              fi
              echo "## Mode: apply (confirmation phrase matched)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac

      - name: Fail closed if a protected input is missing
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          FCB_AIVEN_CA_PEM: ${{ secrets.FCB_AIVEN_CA_PEM }}
          FCB_AIVEN_CA_SHA256: ${{ secrets.FCB_AIVEN_CA_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${FCB_DEFAULTDB_URL:-}" ]; then
            echo "::error::environment secret FCB_DEFAULTDB_URL is not set"; exit 1
          fi
          if [ -z "${FCB_AIVEN_CA_PEM:-}" ] || [ -z "${FCB_AIVEN_CA_SHA256:-}" ]; then
            echo "::error::authenticated Aiven CA inputs are not set"; exit 1
          fi

      - name: Fail closed if a role password is missing or weak (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          FCB_APP_DB_PASSWORD: ${{ secrets.FCB_APP_DB_PASSWORD }}
          FCB_MIGRATOR_DB_PASSWORD: ${{ secrets.FCB_MIGRATOR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Presence, alphabet/length, distinct, not the administrative password. Prints categories only.
          python3 -I -S scripts/fcb_db_roles.py check

      - name: Materialize and authenticate the Aiven project CA
        env:
          FCB_AIVEN_CA_PEM: ${{ secrets.FCB_AIVEN_CA_PEM }}
          FCB_AIVEN_CA_SHA256: ${{ secrets.FCB_AIVEN_CA_SHA256 }}
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/aiven-ca.pem"
          umask 077
          printf '%s' "$FCB_AIVEN_CA_PEM" > "$ca"
          openssl x509 -in "$ca" -noout -subject -issuer -dates >/dev/null
          actual="$(sha256sum "$ca" | cut -d' ' -f1)"
          test "$actual" = "$FCB_AIVEN_CA_SHA256" || {
            echo "::error::Aiven CA checksum mismatch"; exit 1;
          }
          echo "PGSSLROOTCERT=$ca" >> "$GITHUB_ENV"
          echo "Aiven CA parsed and matched the protected SHA-256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the pinned SHA-256 of every SQL file of the roles transaction
        run: |
          set -euo pipefail
          # Hash-pinned: this is the only third-party code that later runs with role passwords in its env.
          python -m pip install --quiet --require-hashes --no-deps -r scripts/fcb_db_roles_requirements.txt
          n=0
          while IFS='=' read -r f sha; do
            [ -n "$f" ] || continue
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            test "$actual" = "$sha" || { echo "::error::$f differs from its pinned SHA-256"; exit 1; }
            n=$((n + 1))
          done <<< "$EXPECTED_SQL_SHA256"
          test "$n" -eq 14 || { echo "::error::expected 14 pinned SQL files, found $n"; exit 1; }
          if grep -Eq 'signer_ledger_anchors|signer_ledger_writer_leases|signer_schema_migrations' \
               sql/aiven/upsert_bridge_roles.sql sql/aiven/prepare_bridge_roles.sql sql/aiven/finalize_bridge_privileges.sql; then
            echo "::error::signer content found in a roles script"; exit 1
          fi
          echo "pinned SQL files: $n verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Install postgresql-client-18 from PGDG (pinned key fingerprint)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '/^fpr/{print $10; exit}')"
          test "$fpr" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version

      - name: Mask connection details and enforce TLS
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
        run: |
          set -euo pipefail
          # -I -S: isolated interpreter, no site-packages (.pth) while the secret is in env.
          python -I -S - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, parse_qs, unquote
          raw = os.environ['FCB_DEFAULTDB_URL']
          try:
              u = urlsplit(raw)
              parts = (u.hostname, u.username, u.password, u.password and unquote(u.password), str(u.port or ''))
              q = parse_qs(u.query, keep_blank_values=True)
          except Exception:
              sys.exit('::error::secret is not a parseable PostgreSQL URI')
          for v in parts:
              if v:
                  print(f'::add-mask::{v}')
          if u.scheme not in ('postgres', 'postgresql'):
              sys.exit('::error::unexpected URL scheme')
          if ',' in u.netloc or not u.hostname:
              sys.exit('::error::multi-host or empty host URIs are not allowed')
          if u.netloc.count('@') > 1:
              sys.exit('::error::password contains an unencoded @ (percent-encode it as %40)')
          if u.path.lstrip('/') != os.environ['EXPECTED_DB']:
              sys.exit('::error::secret does not point to the expected database')
          forbidden = {'dbname', 'host', 'hostaddr', 'port', 'service', 'servicefile', 'options', 'target_session_attrs'}
          if forbidden & {k.lower() for k in q}:
              sys.exit('::error::URI query parameters that can redirect the connection are not allowed')
          mode = q.get('sslmode', [None])[0]
          if mode != 'verify-full' or len(q.get('sslmode', [])) != 1:
              sys.exit('::error::sslmode must be verify-full')
          PY
          python -I -S scripts/aiven_pg18_diag.py check-raw
          python -I -S scripts/aiven_pg18_diag.py target | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prechecks and roles report (read-only)
        env:
          # Read-only sessions; overrides any database/role search_path setting.
          PGOPTIONS: '-c search_path=public -c quote_all_identifiers=off -c default_transaction_read_only=on'
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          qf() {
            local err out
            err="$(mktemp)"
            if out="$("$PSQL" "$FCB_DEFAULTDB_URL" -X -A -t -v ON_ERROR_STOP=1 "$@" 2>"$err")"; then
              rm -f "$err"; printf '%s\n' "$out"
            else
              echo "::error::read-only query failed" >&2
              echo "psql (sanitized): $(python -I -S scripts/fcb_db_roles.py sanitize "$err")" >&2
              rm -f "$err"; return 1
            fi
          }
          db="$(qf -c 'select pg_catalog.current_database()')"
          test "$db" = "$EXPECTED_DB" || { echo "::error::wrong database"; exit 1; }
          ver="$(qf -c "select pg_catalog.current_setting('server_version_num')::pg_catalog.int4")"
          [ "$ver" -ge 180000 ] && [ "$ver" -lt 190000 ] || { echo "::error::server is not PostgreSQL 18"; exit 1; }
          ssl="$(qf -c 'select s.ssl from pg_catalog.pg_stat_ssl s where s.pid OPERATOR(pg_catalog.=) pg_catalog.pg_backend_pid()')"
          test "$ssl" = "t" || { echo "::error::connection is not TLS"; exit 1; }
          ro="$(qf -c "select pg_catalog.current_setting('transaction_read_only')")"
          test "$ro" = "on" || { echo "::error::diagnostic session is not read-only"; exit 1; }
          roles_state="$(qf -f sql/aiven/verify_bridge_roles.sql)"
          state="$(qf -f sql/aiven/defaultdb_precheck.sql)"
          if [ "$state" = "TRACKED" ]; then state="$(qf -f sql/aiven/defaultdb_precheck_tracked.sql)"; fi
          report="$(qf -f sql/aiven/diagnose_bridge_roles.sql)"
          {
            echo "## Restore precheck state: $state"
            echo "## Roles model: $roles_state"
            echo '```'
            printf '%s\n' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$report"
          if [ "$roles_state" = "HARDENED" ]; then
            echo "## Precheck: roles already HARDENED (an apply is an idempotent re-run)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$state" = "BRIDGE_0001_0008" ] && [ "$roles_state" = "ROLES_ABSENT" ]; then
            echo "## Precheck: BRIDGE_0001_0008, no bridge role yet (first apply allowed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::roles refused: precheck state $state and roles model $roles_state"; exit 1
          fi

      - name: Diagnose mode - stop before any write
        if: ${{ inputs.mode != 'apply' }}
        run: |
          echo "## Diagnose mode: read-only report only, the apply step is skipped (no writes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply roles and privileges (single transaction, run twice) and verify
        # Writes only with mode=apply AND the exact confirmation phrase (re-checked here).
        if: ${{ inputs.mode == 'apply' && inputs.confirm == 'APPLY WP-009 ROLES TO defaultdb' }}
        env:
          PGOPTIONS: '-c search_path=public -c quote_all_identifiers=off'
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          FCB_APP_DB_PASSWORD: ${{ secrets.FCB_APP_DB_PASSWORD }}
          FCB_MIGRATOR_DB_PASSWORD: ${{ secrets.FCB_MIGRATOR_DB_PASSWORD }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          GUARD="DO \$guard\$ BEGIN IF pg_catalog.current_database() OPERATOR(pg_catalog.<>) '$EXPECTED_DB'::pg_catalog.name OR pg_catalog.current_schema() IS NULL OR pg_catalog.current_schema() OPERATOR(pg_catalog.<>) 'public'::pg_catalog.name OR (pg_catalog.current_schemas(true))[1] OPERATOR(pg_catalog.<>) 'pg_catalog'::pg_catalog.name OR pg_catalog.current_setting('search_path') OPERATOR(pg_catalog.<>) 'public'::pg_catalog.text OR CURRENT_USER OPERATOR(pg_catalog.<>) SESSION_USER OR EXISTS (SELECT 1 FROM pg_catalog.pg_settings g WHERE g.source OPERATOR(pg_catalog.=) ANY (ARRAY['database', 'user', 'database user']::pg_catalog.text[]) AND g.name OPERATOR(pg_catalog.<>) 'search_path'::pg_catalog.text) OR EXISTS (SELECT 1 FROM pg_catalog.pg_namespace n JOIN pg_catalog.pg_roles r_owner ON r_owner.oid OPERATOR(pg_catalog.=) n.nspowner WHERE n.nspname OPERATOR(pg_catalog.<>) ALL (ARRAY['public', 'pg_catalog', 'information_schema', 'pg_toast']::pg_catalog.name[]) AND n.nspname OPERATOR(pg_catalog.!~) '^pg_(toast_)?temp_[0-9]+\$'::pg_catalog.text AND NOT (n.nspname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name AND n.nspowner OPERATOR(pg_catalog.<>) (SELECT r.oid FROM pg_catalog.pg_roles r WHERE r.rolname OPERATOR(pg_catalog.=) SESSION_USER) AND (r_owner.rolsuper OR r_owner.rolname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name) AND NOT pg_catalog.pg_has_role(SESSION_USER, n.nspowner, 'MEMBER') AND NOT pg_catalog.has_schema_privilege(SESSION_USER, n.oid, 'CREATE'))) OR pg_catalog.current_setting('server_version_num')::pg_catalog.int4 OPERATOR(pg_catalog.<) 180000 OR pg_catalog.current_setting('server_version_num')::pg_catalog.int4 OPERATOR(pg_catalog.>) 189999 OR NOT COALESCE((SELECT s.ssl FROM pg_catalog.pg_stat_ssl s WHERE s.pid OPERATOR(pg_catalog.=) pg_catalog.pg_backend_pid()), false) THEN RAISE EXCEPTION 'FCB_TARGET_GUARD_FAILED'; END IF; END \$guard\$"
          sp() {
            local err rc=0
            err="$(mktemp)"
            "$PSQL" "$FCB_DEFAULTDB_URL" "$@" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::psql failed (exit $rc)" >&2
              echo "psql (sanitized): $(python -I -S scripts/fcb_db_roles.py sanitize "$err")" >&2
            fi
            rm -f "$err"; return "$rc"
          }
          ro() { PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on" sp -X -A -t -v ON_ERROR_STOP=1 "$@"; }
          state() {
            local s
            s="$(ro -f sql/aiven/defaultdb_precheck.sql)"
            if [ "$s" = "TRACKED" ]; then s="$(ro -f sql/aiven/defaultdb_precheck_tracked.sql)"; fi
            printf '%s' "$s"
          }
          # Re-check right before writing: the state may have changed since the precheck step.
          roles_before="$(ro -f sql/aiven/verify_bridge_roles.sql)"
          before="$(state)"
          if [ "$roles_before" != "HARDENED" ] && { [ "$before" != "BRIDGE_0001_0008" ] || [ "$roles_before" != "ROLES_ABSENT" ]; }; then
            echo "::error::state changed since precheck ($before / $roles_before); refusing"; exit 1
          fi
          # Expected migration rows, from the repository files (version=name=sha256), checked in-transaction.
          migrations="$(for f in sql/migrations/bridge/000[1-8]_*.sql; do n="$(basename "$f")"; echo "$((10#${n:0:4}))=$n=$(sha256sum "$f" | cut -d' ' -f1)"; done | paste -sd' ')"
          # SCRAM-SHA-256 verifiers, computed on the runner and kept in shell variables only: never
          # echoed (not even as ::add-mask::), never in the runner env files or argv; psql reads them from its
          # own environment with \getenv, and psql stderr is printed only after
          # scripts/fcb_db_roles.py sanitize, which drops every line carrying SCRAM-SHA-256 or PASSWORD.
          app_verifier="$(python -I -S scripts/fcb_db_roles.py verifier FCB_APP_DB_PASSWORD)"
          migrator_verifier="$(python -I -S scripts/fcb_db_roles.py verifier FCB_MIGRATOR_DB_PASSWORD)"
          schema_before="$(ro -F '=' -f sql/aiven/verify_bridge_schema.sql)"
          structure_before="$(ro -f sql/aiven/fingerprint_bridge_structure.sql)"
          if [ "$roles_before" != "HARDENED" ]; then
            # First apply: the database is exactly the restored bridge (owners and ACLs included).
            full_before="$(ro -f sql/aiven/fingerprint_bridge_schema.sql)"
            test "$full_before" = "$EXPECTED_FINGERPRINT" || { echo "::error::catalog fingerprint is not the restored one"; exit 1; }
          fi
          # ONE transaction: target guard, state/owner/migration guard under the bridge advisory
          # lock, roles, prepare, finalize, object counts, final model. Any failure aborts it.
          run() { FCB_APP_DB_VERIFIER="$app_verifier" FCB_MIGRATOR_DB_VERIFIER="$migrator_verifier" \
                    sp -X -q -v ON_ERROR_STOP=1 -v expected_counts="$EXPECTED_COUNTS" -v expected_migrations="$migrations" -1 \
                    -c "$GUARD" -f sql/aiven/roles_apply_guard.sql -f sql/aiven/upsert_bridge_roles.sql -f sql/aiven/prepare_bridge_roles.sql -f sql/aiven/finalize_bridge_privileges.sql -f sql/aiven/roles_post_checks.sql -f sql/aiven/assert_bridge_roles.sql >/dev/null; }
          run;    first="$(ro -f sql/aiven/diagnose_bridge_roles.sql)"
          run;    second="$(ro -f sql/aiven/diagnose_bridge_roles.sql)"
          test "$first" = "$second" || { echo "::error::second run changed the roles evidence"; exit 1; }
          schema_after="$(ro -F '=' -f sql/aiven/verify_bridge_schema.sql)"
          test "$schema_before" = "$schema_after" || { echo "::error::schema evidence changed"; exit 1; }
          structure_after="$(ro -f sql/aiven/fingerprint_bridge_structure.sql)"
          test "$structure_before" = "$structure_after" || { echo "::error::bridge structure fingerprint changed"; exit 1; }
          counts="$(printf '%s\n' "$schema_after" | head -n 7 | paste -sd' ')"
          test "$counts" = "$EXPECTED_COUNTS" || { echo "::error::object counts differ from expected"; exit 1; }
          roles_after="$(ro -f sql/aiven/verify_bridge_roles.sql)"
          test "$roles_after" = "HARDENED" || { echo "::error::post-apply roles model is $roles_after"; exit 1; }
          # Both new identities log in over verify-full and are checked read-only (rolled back probes).
          python -I scripts/fcb_db_roles.py login-check --require-tls | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "## Roles: PASS (state before: $before / $roles_before; run 2 no-op; model after: $roles_after; schema evidence and structure fingerprint $structure_after unchanged; owners/ACLs changed by design)"
            echo '```'
            printf '%s\n' "$second"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
