name: api-football-39-route-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: api-football-live-provider
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G-02: this job receives a production database DSN (shared quota coordinator).
    if: github.ref == 'refs/heads/main'
    environment: api-football-live
    env:
      PYTHONPATH: .
      APIFOOTBALL_ENABLED: 'true'
      APIFOOTBALL_LIVE_AUTHORIZED: 'true'
      # WP-003: shared PostgreSQL quota coordinator (CLAUDE.md §2.4). Configured by the owner
      # in the api-football-live environment; without it the job fails closed before any call.
      # APIFOOTBALL_MAX_* below are checked against the key's SHARED counters (runtime + every
      # workflow, same UTC day/minute), not against this job alone: a job is refused once the
      # key's shared day total reaches its APIFOOTBALL_MAX_DAILY_REQUESTS. Raising it = owner.
      # Secrets (API key, coordinator DSN) are given only to the steps that need them,
      # after the G-02 gate step below.
      APIFOOTBALL_MAX_DAILY_REQUESTS: '39'
      APIFOOTBALL_MAX_RPM: '8'
      APIFOOTBALL_MAX_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a protected environment and a trusted dispatch (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          # Fails closed on any API/JSON error, a missing reviewer or a missing main-only branch policy.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" api-football-live)"
          echo "## Gate: environment api-football-live protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: No-secret preflight
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        run: |
          test -n "$APIFOOTBALL_API_KEY" || (echo 'API key not configured' && exit 1)
      - name: Coordinator database preflight (fail closed, no value output)
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL// /}" ]; then
            echo 'COORDINATOR_DATABASE_REQUIRED: no live call without the shared quota coordinator'
            exit 1
          fi
      - name: Offline bounded-probe tests
        run: python -m pytest -q tests/test_api_football_39_route_inventory.py
      - name: Provider inventory (manual only)
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.APIFOOTBALL_COORDINATOR_DATABASE_URL }}
        run: python scripts/api_football_39_route_inventory.py --authorize-live-inventory --output /tmp/route_inventory.json
      - name: Publish redacted evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report = Path("/tmp/route_inventory.json")
          if not report.is_file():
              output.open("a").write("### API-FOOTBALL inventory" + chr(10) * 2 + "No evidence file generated." + chr(10))
          else:
              data = json.loads(report.read_text())
              lines = ["### 39 API-FOOTBALL paths — observed evidence", "",
                       "Path coverage is not parameter/schema or availability certification.", "",
                       "| Path | Outcome | HTTP | Results | Day left | Minute left |",
                       "|---|---|---:|---:|---:|---:|"]
              for x in data["records"]:
                  lines.append("| {} | {} | {} | {} | {} | {} |".format(x["path"], x["outcome"],
                      x.get("http_status"), x.get("results"), x.get("quota_day"), x.get("quota_minute")))
              lines.extend(["", "Requests attempted: {} / 39".format(data["requests_attempted"])])
              output.open("a").write(chr(10).join(lines) + chr(10))
          PY
      - name: Publish recoverable evidence ZIP in downloadable job logs
        if: always()
        shell: bash
        run: |
          python scripts/api_football_evidence_log_transport.py --encode /tmp/route_inventory.json /tmp/route_inventory.csv
      - name: Upload complete sanitized route JSON and CSV
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: api-football-39-route-evidence
          path: |
            /tmp/route_inventory.json
            /tmp/route_inventory.csv
          if-no-files-found: warn
          retention-days: 7
