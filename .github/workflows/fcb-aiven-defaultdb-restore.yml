name: FCB Aiven defaultdb restore (owner-gated)

# FCB-WP-005. Manual only. Restores the PRODUCTION database `defaultdb` (Aiven piero-1, PG18) to
# the bridge migration series 0001-0008. Never applies the signer series. Gates, all required:
#   1. GitHub Environment `aiven-production` with at least one required reviewer (checked by
#      the job itself; an auto-created unprotected environment is refused). The repository is
#      public, where required reviewers are available on every GitHub plan; the job is started
#      and re-run only by the repository owner (github.triggering_actor), a second gate;
#   2. the secrets FCB_DEFAULTDB_URL, FCB_AIVEN_CA_PEM and FCB_AIVEN_CA_SHA256 exist only
#      in that environment (owner-created from the authenticated Aiven project CA);
#   3. mode=apply AND the exact confirmation phrase; default mode=diagnose never writes;
#   4. pinned target (host/port hashes, database name), PostgreSQL 18, TLS verify-full;
#   5. a read-only precheck state that allows it (EMPTY, RUNTIME_ONLY, BRIDGE_0001_0007,
#      BRIDGE_0001_0008), re-checked inside the apply step right before writing;
#   6. one transaction with an in-session target guard; second run must be a no-op.
# Every guard and evidence query is schema-qualified (relations, functions, operators) and the
# in-transaction files re-assert the session (search_path, CURRENT_USER = SESSION_USER, no
# database/role settings, no unexpected schema) before pinning search_path again: code planted
# in public cannot redirect them (audit of 2026-11-09, F1-F8).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose = read-only prechecks (default); apply = restore bridge 0001-0008 to defaultdb"
        type: choice
        options: [diagnose, apply]
        default: diagnose
      confirm:
        description: "For mode=apply only: type exactly APPLY BRIDGE 0001-0008 TO defaultdb"
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: fcb-aiven-defaultdb-restore
  cancel-in-progress: false

jobs:
  restore:
    # G-02: second layer; the environment (required reviewer + branch main) is the control.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aiven-production
    env:
      EXPECTED_DB: defaultdb
      FCB_DB_URL_VAR: FCB_DEFAULTDB_URL
      CONFIRM_PHRASE: APPLY BRIDGE 0001-0008 TO defaultdb
      SCRIPT: sql/aiven/aiven_migrations_bridge_0001_0008.sql
      EXPECTED_SCRIPT_SHA256: a6525b5baeade9cad1f3eb5fc27c506199c3d30ccabab5fd57f21eeb01b85a5c
      # Object counts after the restore on PostgreSQL 18, pinned and checked in CI (postgres-18)
      # by tests/integration/test_defaultdb_restore_postgres.py.
      # md5 catalog fingerprint of the end state on PostgreSQL 18 (sql/aiven/fingerprint_bridge_schema.sql),
      # asserted inside the transaction; pinned and checked by the postgres-18 CI job.
      EXPECTED_FINGERPRINT: 'b825ab11029502140b038ce6d3add670'
      EXPECTED_COUNTS: 'tables=33 functions=4 triggers=9 indexes=60 constraints_information_schema=325 constraints_pg_constraint=65 schema_migrations_rows=8'
      PGCONNECT_TIMEOUT: '15'
      # Same Aiven service as fcb-aiven-pg18-test.yml (public values from the Aiven API).
      EXPECTED_HOST_SHA256: 17d6eaa1929aefc16dcdbc6496ab9159944df8b8944e96d1012c555394e8d42b
      EXPECTED_PORT: '14274'
      EXPECTED_PORT_SHA256: e7c3aa32557c7cac5c20f5d28cfa30de75572446ff444407b33670df74475b04
      PGPORT: '14274'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a protected environment (required reviewer), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fails closed on any API/JSON error or a missing/zero reviewer count.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" aiven-production)"
          echo "## Gate: environment aiven-production protected (required reviewers: $reviewers)" >> "$GITHUB_STEP_SUMMARY"

      - name: Mode and confirmation gate
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          # Only the reviewed workflow on main may restore production.
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::the defaultdb restore runs only from main"; exit 1
          fi
          # Second, plan-independent gate: only the repository owner may start (or re-run) it.
          if [ "$TRIGGERING_ACTOR" != "$REPO_OWNER" ] || [ "$ACTOR" != "$REPO_OWNER" ]; then
            echo "::error::only the repository owner may run the defaultdb restore"; exit 1
          fi
          case "$MODE" in
            diagnose) echo "## Mode: diagnose (read-only)" >> "$GITHUB_STEP_SUMMARY" ;;
            apply)
              if [ "$CONFIRM" != "$CONFIRM_PHRASE" ]; then
                echo "::error::mode=apply requires the exact confirmation phrase"; exit 1
              fi
              echo "## Mode: apply (confirmation phrase matched)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac

      - name: Fail closed if a protected input is missing
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          FCB_AIVEN_CA_PEM: ${{ secrets.FCB_AIVEN_CA_PEM }}
          FCB_AIVEN_CA_SHA256: ${{ secrets.FCB_AIVEN_CA_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${FCB_DEFAULTDB_URL:-}" ]; then
            echo "::error::environment secret FCB_DEFAULTDB_URL is not set"; exit 1
          fi
          if [ -z "${FCB_AIVEN_CA_PEM:-}" ] || [ -z "${FCB_AIVEN_CA_SHA256:-}" ]; then
            echo "::error::authenticated Aiven CA inputs are not set"; exit 1
          fi

      - name: Materialize and authenticate the Aiven project CA
        env:
          FCB_AIVEN_CA_PEM: ${{ secrets.FCB_AIVEN_CA_PEM }}
          FCB_AIVEN_CA_SHA256: ${{ secrets.FCB_AIVEN_CA_SHA256 }}
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/aiven-ca.pem"
          umask 077
          printf '%s' "$FCB_AIVEN_CA_PEM" > "$ca"
          openssl x509 -in "$ca" -noout -subject -issuer -dates >/dev/null
          actual="$(sha256sum "$ca" | cut -d' ' -f1)"
          test "$actual" = "$FCB_AIVEN_CA_SHA256" || {
            echo "::error::Aiven CA checksum mismatch"; exit 1;
          }
          echo "PGSSLROOTCERT=$ca" >> "$GITHUB_ENV"
          echo "Aiven CA parsed and matched the protected SHA-256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the bridge script and verify the pinned SHA-256 (no signer series)
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]==3.3.6'
          generated="$(python scripts/generate_aiven_migrations.py --target bridge-0001-0008 --check)"
          # The in-transaction state guard must be regenerated from the committed prechecks.
          python scripts/generate_aiven_migrations.py --target restore-guard --check >/dev/null
          python scripts/generate_aiven_migrations.py --target restore-post-guard --check >/dev/null
          actual="$(sha256sum "$SCRIPT" | cut -d' ' -f1)"
          test "$generated" = "$EXPECTED_SCRIPT_SHA256"
          test "$actual" = "$EXPECTED_SCRIPT_SHA256"
          if grep -Eq 'signer_ledger_anchors|signer_ledger_writer_leases|signer_schema_migrations' "$SCRIPT"; then
            echo "::error::signer content found"; exit 1
          fi
          echo "script_sha256=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Install postgresql-client-18 from PGDG (pinned key fingerprint)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Transient TLS EOFs from postgresql.org failed runs 9 and 11 before any database step:
          # retry the download; the pinned fingerprint check below still decides trust.
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '/^fpr/{print $10; exit}')"
          test "$fpr" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version

      - name: Mask connection details and enforce TLS
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
        run: |
          set -euo pipefail
          # -I -S: isolated interpreter, no site-packages (.pth) while the secret is in env.
          python -I -S - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, parse_qs, unquote
          raw = os.environ['FCB_DEFAULTDB_URL']
          try:
              u = urlsplit(raw)
              parts = (u.hostname, u.username, u.password, u.password and unquote(u.password), str(u.port or ''))
              q = parse_qs(u.query, keep_blank_values=True)
          except Exception:
              sys.exit('::error::secret is not a parseable PostgreSQL URI')
          for v in parts:
              if v:
                  print(f'::add-mask::{v}')
          if u.scheme not in ('postgres', 'postgresql'):
              sys.exit('::error::unexpected URL scheme')
          if ',' in u.netloc or not u.hostname:
              sys.exit('::error::multi-host or empty host URIs are not allowed')
          # libpq splits userinfo at the FIRST '@' (Python at the last): an unencoded '@' in the
          # password would make libpq connect to a different host string. Require percent-encoding.
          if u.netloc.count('@') > 1:
              sys.exit('::error::password contains an unencoded @ (percent-encode it as %40)')
          expected = os.environ['EXPECTED_DB']
          dbpath = u.path.lstrip('/')
          if dbpath != expected:
              # Non-sensitive classification only: the path value itself is never printed.
              if not dbpath:
                  why = 'path_empty'
              elif dbpath == 'defaultdb':
                  why = 'path_is_defaultdb'
              elif dbpath.rstrip('/') == expected:
                  why = 'trailing_slash'
              elif dbpath.strip() == expected or any(c.isspace() for c in dbpath):
                  why = 'whitespace_in_path'
              elif '%' in dbpath and unquote(dbpath) == expected:
                  why = 'percent_encoded_name'
              elif dbpath.lower() == expected:
                  why = 'case_mismatch'
              else:
                  why = f'other_name_len_{len(dbpath)}'
              sys.exit(f'::error::secret does not point to the expected database ({why})')
          forbidden = {'dbname', 'host', 'hostaddr', 'port', 'service', 'servicefile', 'options', 'target_session_attrs'}
          if forbidden & {k.lower() for k in q}:
              sys.exit('::error::URI query parameters that can redirect the connection are not allowed')
          mode = q.get('sslmode', [None])[0]
          if mode != 'verify-full' or len(q.get('sslmode', [])) != 1:
              sys.exit('::error::sslmode must be verify-full')
          PY
          # urlsplit silently drops spaces/newlines/tabs that libpq keeps (e.g. a final newline
          # after "sslmode=verify-full" makes libpq fail before connecting): reject it explicitly.
          python -I -S scripts/aiven_pg18_diag.py check-raw
          # Fail-closed target policy before any connection: pinned host, exact database,
          # port from the pinned config (empty/absent URI port) or equal to it (explicit).
          python -I -S scripts/aiven_pg18_diag.py target | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Network probe (DNS families and TCP reachability; categories only)
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
        run: |
          set -euo pipefail
          python -I -S scripts/aiven_pg18_diag.py probe | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prechecks (database, PostgreSQL 18, TLS, restore state)
        env:
          # Overrides any database/role search_path setting; pg_catalog stays implicitly first.
          PGOPTIONS: '-c search_path=public -c quote_all_identifiers=off'
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          classify() {
            local f="$1"
            if grep -qiE 'password authentication failed' "$f"; then echo auth_failed
            elif grep -qiE 'could not translate host name|Name or service not known|Temporary failure in name resolution|nodename nor servname' "$f"; then echo dns_resolution_failed
            elif grep -qiE 'invalid URI|invalid connection option|invalid percent-encoded|invalid integer value|invalid port number|unexpected .* in URI|missing "=" after|invalid [a-z_]+ value' "$f"; then echo libpq_rejected_uri
            elif grep -qiE 'timeout expired|timed out' "$f"; then echo connect_timeout
            elif grep -qiE 'Connection refused' "$f"; then echo connection_refused
            elif grep -qiE 'Network is unreachable|No route to host|Cannot assign requested address' "$f"; then echo network_unreachable
            elif grep -qiE 'server closed the connection|Connection reset|could not receive data|could not send data' "$f"; then echo connection_closed
            elif grep -qiE 'no pg_hba.conf entry|not permitted to log in' "$f"; then echo access_rule_rejected
            elif grep -qiE 'database .* does not exist' "$f"; then echo database_missing
            elif grep -qiE 'too many connections|remaining connection slots' "$f"; then echo too_many_connections
            elif grep -qiE 'SSL|certificate|TLS' "$f"; then echo tls_error
            else echo other_error
            fi
          }
          q() {
            local err out
            err="$(mktemp)"
            if out="$("$PSQL" "$FCB_DEFAULTDB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "$1" 2>"$err")"; then
              rm -f "$err"; printf '%s\n' "$out"
            else
              echo "::error::precheck query failed ($(classify "$err"))" >&2
              echo "libpq (sanitized): $(python -I -S scripts/aiven_pg18_diag.py sanitize "$err")" >&2
              rm -f "$err"; return 1
            fi
          }
          qf() {
            local err out
            err="$(mktemp)"
            if out="$("$PSQL" "$FCB_DEFAULTDB_URL" -X -A -t -v ON_ERROR_STOP=1 -f "$1" 2>"$err")"; then
              rm -f "$err"; printf '%s\n' "$out"
            else
              echo "::error::precheck file failed ($(classify "$err"))" >&2
              echo "libpq (sanitized): $(python -I -S scripts/aiven_pg18_diag.py sanitize "$err")" >&2
              rm -f "$err"; return 1
            fi
          }
          db="$(q 'select pg_catalog.current_database()')"
          test "$db" = "$EXPECTED_DB" || { echo "::error::wrong database"; exit 1; }
          ver="$(q "select pg_catalog.current_setting('server_version_num')::pg_catalog.int4")"
          [ "$ver" -ge 180000 ] && [ "$ver" -lt 190000 ] || { echo "::error::server is not PostgreSQL 18"; exit 1; }
          ssl="$(q 'select s.ssl from pg_catalog.pg_stat_ssl s where s.pid OPERATOR(pg_catalog.=) pg_catalog.pg_backend_pid()')"
          test "$ssl" = "t" || { echo "::error::connection is not TLS"; exit 1; }
          cs="$(q 'select pg_catalog.current_schema()')"
          test "$cs" = "public" || { echo "::error::current schema is not public"; exit 1; }
          # Anchored temp-schema regex and Aiven's real `_avnadmin_monitor` shape only (audit F1), same
          # predicate as the in-transaction guards (scripts/generate_aiven_migrations.py).
          schemas="$(q "select pg_catalog.count(*) from pg_catalog.pg_namespace n join pg_catalog.pg_roles r_owner on r_owner.oid OPERATOR(pg_catalog.=) n.nspowner where n.nspname OPERATOR(pg_catalog.<>) ALL (ARRAY['public', 'pg_catalog', 'information_schema', 'pg_toast']::pg_catalog.name[]) and n.nspname OPERATOR(pg_catalog.!~) '^pg_(toast_)?temp_[0-9]+\$'::pg_catalog.text and not (n.nspname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name and n.nspowner OPERATOR(pg_catalog.<>) (select r.oid from pg_catalog.pg_roles r where r.rolname OPERATOR(pg_catalog.=) SESSION_USER) and (r_owner.rolsuper or r_owner.rolname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name) and not pg_catalog.pg_has_role(SESSION_USER, n.nspowner, 'MEMBER') and not pg_catalog.has_schema_privilege(SESSION_USER, n.oid, 'CREATE'))")"
          [ "$schemas" = "0" ] || { echo "::error::unexpected non-system schemas present ($schemas); refusing"; exit 1; }
          state="$(qf sql/aiven/defaultdb_precheck.sql)"
          if [ "$state" = "TRACKED" ]; then state="$(qf sql/aiven/defaultdb_precheck_tracked.sql)"; fi
          echo "## Precheck state: $state" >> "$GITHUB_STEP_SUMMARY"
          case "$state" in
            EMPTY|RUNTIME_ONLY|BRIDGE_0001_0007|BRIDGE_0001_0008) ;;
            *) echo "::error::restore refused by precheck state $state"; exit 1 ;;
          esac

      - name: Sanitized first-install inventory (read-only, no row contents)
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          report="$(python scripts/defaultdb_first_init_inventory.py)"
          printf '%s\n' "FIRST_INIT_INVENTORY=$report"
          state="$(python -c 'import json,sys; print(json.load(sys.stdin)["precheck_state"])' <<<"$report")"
          verdict="$(python -c 'import json,sys; print(str(json.load(sys.stdin)["first_time_initialization_proven"]).lower())' <<<"$report")"
          echo "## Sanitized inventory: precheck_state=$state first_time_initialization_proven=$verdict" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose mode - stop before any write
        if: ${{ inputs.mode != 'apply' }}
        run: |
          echo "## Diagnose mode: prechecks only, the restore step is skipped (no writes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore bridge 0001-0008 (single transaction, run twice) and verify
        # Writes only with mode=apply AND the exact confirmation phrase (re-checked here).
        if: ${{ inputs.mode == 'apply' && inputs.confirm == 'APPLY BRIDGE 0001-0008 TO defaultdb' }}
        env:
          PGOPTIONS: '-c search_path=public -c quote_all_identifiers=off'
          FCB_DEFAULTDB_URL: ${{ secrets.FCB_DEFAULTDB_URL }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          GUARD="DO \$guard\$ BEGIN IF pg_catalog.current_database() OPERATOR(pg_catalog.<>) '$EXPECTED_DB'::pg_catalog.name OR pg_catalog.current_schema() IS NULL OR pg_catalog.current_schema() OPERATOR(pg_catalog.<>) 'public'::pg_catalog.name OR (pg_catalog.current_schemas(true))[1] OPERATOR(pg_catalog.<>) 'pg_catalog'::pg_catalog.name OR pg_catalog.current_setting('search_path') OPERATOR(pg_catalog.<>) 'public'::pg_catalog.text OR CURRENT_USER OPERATOR(pg_catalog.<>) SESSION_USER OR EXISTS (SELECT 1 FROM pg_catalog.pg_settings g WHERE g.source OPERATOR(pg_catalog.=) ANY (ARRAY['database', 'user', 'database user']::pg_catalog.text[]) AND g.name OPERATOR(pg_catalog.<>) 'search_path'::pg_catalog.text) OR EXISTS (SELECT 1 FROM pg_catalog.pg_namespace n JOIN pg_catalog.pg_roles r_owner ON r_owner.oid OPERATOR(pg_catalog.=) n.nspowner WHERE n.nspname OPERATOR(pg_catalog.<>) ALL (ARRAY['public', 'pg_catalog', 'information_schema', 'pg_toast']::pg_catalog.name[]) AND n.nspname OPERATOR(pg_catalog.!~) '^pg_(toast_)?temp_[0-9]+\$'::pg_catalog.text AND NOT (n.nspname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name AND n.nspowner OPERATOR(pg_catalog.<>) (SELECT r.oid FROM pg_catalog.pg_roles r WHERE r.rolname OPERATOR(pg_catalog.=) SESSION_USER) AND (r_owner.rolsuper OR r_owner.rolname OPERATOR(pg_catalog.=) '_avnadmin_monitor'::pg_catalog.name) AND NOT pg_catalog.pg_has_role(SESSION_USER, n.nspowner, 'MEMBER') AND NOT pg_catalog.has_schema_privilege(SESSION_USER, n.oid, 'CREATE'))) OR pg_catalog.current_setting('server_version_num')::pg_catalog.int4 OPERATOR(pg_catalog.<) 180000 OR pg_catalog.current_setting('server_version_num')::pg_catalog.int4 OPERATOR(pg_catalog.>) 189999 OR NOT COALESCE((SELECT s.ssl FROM pg_catalog.pg_stat_ssl s WHERE s.pid OPERATOR(pg_catalog.=) pg_catalog.pg_backend_pid()), false) THEN RAISE EXCEPTION 'FCB_TARGET_GUARD_FAILED'; END IF; END \$guard\$"
          sp() {
            local err rc=0
            err="$(mktemp)"
            "$PSQL" "$FCB_DEFAULTDB_URL" "$@" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::psql failed (exit $rc)" >&2
              echo "psql (sanitized): $(python -I -S scripts/aiven_pg18_diag.py sanitize "$err")" >&2
            fi
            rm -f "$err"; return "$rc"
          }
          state() {
            local s
            s="$(sp -X -A -t -v ON_ERROR_STOP=1 -f sql/aiven/defaultdb_precheck.sql)"
            if [ "$s" = "TRACKED" ]; then s="$(sp -X -A -t -v ON_ERROR_STOP=1 -f sql/aiven/defaultdb_precheck_tracked.sql)"; fi
            printf '%s' "$s"
          }
          before="$(state)"
          case "$before" in
            EMPTY|RUNTIME_ONLY|BRIDGE_0001_0007|BRIDGE_0001_0008) ;;
            *) echo "::error::state changed since precheck ($before); refusing"; exit 1 ;;
          esac
          # ONE transaction: target guard, state guard (precheck re-evaluated under the bridge
          # advisory lock), bridge script, then the object-count assertion. Any failure, including
          # a count mismatch, aborts the transaction before anything is committed.
          run() { sp -X -q -v ON_ERROR_STOP=1 -v expected_counts="$EXPECTED_COUNTS" -1 -c "$GUARD" \
                    -v expected_fingerprint="$EXPECTED_FINGERPRINT" \
                    -f sql/aiven/defaultdb_restore_guard.sql -f "$SCRIPT" -f sql/aiven/assert_bridge_counts.sql \
                    -f sql/aiven/defaultdb_restore_post_guard.sql >/dev/null; }
          verify() { sp -X -A -t -F '=' -v ON_ERROR_STOP=1 -f sql/aiven/verify_bridge_schema.sql; }
          run;    first="$(verify)"
          applied1="$(sp -X -A -t -c 'select pg_catalog.string_agg(m.applied_at::pg_catalog.text, $$,$$ order by m.version) from public.schema_migrations m')"
          run;    second="$(verify)"
          applied2="$(sp -X -A -t -c 'select pg_catalog.string_agg(m.applied_at::pg_catalog.text, $$,$$ order by m.version) from public.schema_migrations m')"
          test "$first" = "$second" || { echo "::error::second run changed the schema evidence"; exit 1; }
          test "$applied1" = "$applied2" || { echo "::error::second run re-applied migrations"; exit 1; }
          counts="$(printf '%s\n' "$second" | head -n 7 | paste -sd' ')"
          test "$counts" = "$EXPECTED_COUNTS" || { echo "::error::object counts differ from expected"; printf '%s\n' "$counts"; exit 1; }
          files="$(for f in sql/migrations/bridge/000[1-8]_*.sql; do n="$(basename "$f")"; echo "$((10#${n:0:4}))=$n=$(sha256sum "$f" | cut -d' ' -f1)"; done)"
          recorded="$(printf '%s\n' "$second" | tail -n +8)"
          test "$recorded" = "$files" || { echo "::error::recorded migration checksums differ from repo files"; exit 1; }
          after="$(state)"
          test "$after" = "BRIDGE_0001_0008" || { echo "::error::post-restore state is $after"; exit 1; }
          {
            echo "## Restore: PASS (state before: $before; run 1 applied, run 2 no-op; state after: $after)"
            echo '```'
            printf '%s\n' "$second"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
