name: FCB Aiven PG18 migration test (fcb_pg18_test only)

# Manual only. Default mode=diagnose runs read-only prechecks; only mode=apply applies 0001-0007 to fcb_pg18_test.
# Never targets defaultdb, never applies 0008, uses no SX Bet or wallet secrets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose = prechecks only, no writes (default); apply = also apply 0001-0007 to fcb_pg18_test"
        type: choice
        options: [diagnose, apply]
        default: diagnose

permissions:
  contents: read
  actions: read

concurrency:
  group: fcb-aiven-pg18-test
  cancel-in-progress: false

jobs:
  pg18-test:
    # G-02: the database credential lives ONLY in the protected environment aiven-pg18-test
    # (required reviewer + deployment branch main). The `if:` and the gate step below are
    # further layers; the environment configuration is the access control.
    if: github.ref == 'refs/heads/main'
    environment: aiven-pg18-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_DB: fcb_pg18_test
      EXPECTED_SCRIPT_SHA256: b73ed5c206d9a89c150864dba7fa200faef85e1be617e775312148ce83821fde
      SCRIPT: sql/aiven/aiven_migrations_0001_0007.sql
      PGCONNECT_TIMEOUT: '15'
      # Pinned target, independent of the secret (public values of the Aiven service piero-1,
      # from the Aiven API). The host is checked by hash only; the port is explicit config,
      # pinned by its hash and handed to libpq as PGPORT, which libpq uses only when the URI
      # port is empty or absent. An explicit different URI port is rejected by the target check.
      EXPECTED_HOST_SHA256: 17d6eaa1929aefc16dcdbc6496ab9159944df8b8944e96d1012c555394e8d42b
      EXPECTED_PORT: '14274'
      EXPECTED_PORT_SHA256: e7c3aa32557c7cac5c20f5d28cfa30de75572446ff444407b33670df74475b04
      PGPORT: '14274'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a protected environment and a trusted dispatch (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          # Fails closed on any API/JSON error, a missing reviewer or a missing main-only branch policy.
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" aiven-pg18-test)"
          echo "## Gate: environment aiven-pg18-test protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed if the secret is missing
        env:
          FCB_PG18_TEST_URL: ${{ secrets.FCB_PG18_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FCB_PG18_TEST_URL:-}" ]; then
            echo "::error::secret FCB_PG18_TEST_URL is not set"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate script from repo migrations and verify pinned SHA-256
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]==3.3.6'
          generated="$(python scripts/generate_aiven_migrations.py --check)"
          actual="$(sha256sum "$SCRIPT" | cut -d' ' -f1)"
          test "$generated" = "$EXPECTED_SCRIPT_SHA256"
          test "$actual" = "$EXPECTED_SCRIPT_SHA256"
          if grep -Eq '0008|signer_ledger' "$SCRIPT"; then echo "::error::0008 content found"; exit 1; fi
          echo "script_sha256=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Install postgresql-client-18 from PGDG (pinned key fingerprint)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Transient TLS EOFs from postgresql.org failed runs 9 and 11 before any database step:
          # retry the download; the pinned fingerprint check below still decides trust.
          sudo curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '/^fpr/{print $10; exit}')"
          test "$fpr" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version

      - name: Mask connection details and enforce TLS
        env:
          FCB_PG18_TEST_URL: ${{ secrets.FCB_PG18_TEST_URL }}
        run: |
          set -euo pipefail
          # -I -S: isolated interpreter, no site-packages (.pth) while the secret is in env.
          python -I -S - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, parse_qs, unquote
          raw = os.environ['FCB_PG18_TEST_URL']
          try:
              u = urlsplit(raw)
              parts = (u.hostname, u.username, u.password, u.password and unquote(u.password), str(u.port or ''))
              q = parse_qs(u.query, keep_blank_values=True)
          except Exception:
              sys.exit('::error::secret is not a parseable PostgreSQL URI')
          for v in parts:
              if v:
                  print(f'::add-mask::{v}')
          if u.scheme not in ('postgres', 'postgresql'):
              sys.exit('::error::unexpected URL scheme')
          if ',' in u.netloc or not u.hostname:
              sys.exit('::error::multi-host or empty host URIs are not allowed')
          # libpq splits userinfo at the FIRST '@' (Python at the last): an unencoded '@' in the
          # password would make libpq connect to a different host string. Require percent-encoding.
          if u.netloc.count('@') > 1:
              sys.exit('::error::password contains an unencoded @ (percent-encode it as %40)')
          expected = os.environ['EXPECTED_DB']
          dbpath = u.path.lstrip('/')
          if dbpath != expected:
              # Non-sensitive classification only: the path value itself is never printed.
              if not dbpath:
                  why = 'path_empty'
              elif dbpath == 'defaultdb':
                  why = 'path_is_defaultdb'
              elif dbpath.rstrip('/') == expected:
                  why = 'trailing_slash'
              elif dbpath.strip() == expected or any(c.isspace() for c in dbpath):
                  why = 'whitespace_in_path'
              elif '%' in dbpath and unquote(dbpath) == expected:
                  why = 'percent_encoded_name'
              elif dbpath.lower() == expected:
                  why = 'case_mismatch'
              else:
                  why = f'other_name_len_{len(dbpath)}'
              sys.exit(f'::error::secret does not point to the expected database ({why})')
          forbidden = {'dbname', 'host', 'hostaddr', 'port', 'service', 'servicefile', 'options', 'target_session_attrs'}
          if forbidden & {k.lower() for k in q}:
              sys.exit('::error::URI query parameters that can redirect the connection are not allowed')
          mode = q.get('sslmode', ['require'])[0]
          if mode not in ('require', 'verify-ca', 'verify-full'):
              sys.exit('::error::sslmode must be require, verify-ca or verify-full')
          PY
          # urlsplit silently drops spaces/newlines/tabs that libpq keeps (e.g. a final newline
          # after "sslmode=require" makes libpq fail before connecting): reject them explicitly.
          python -I -S scripts/aiven_pg18_diag.py check-raw
          # Fail-closed target policy before any connection: pinned host, exact database,
          # port from the pinned config (empty/absent URI port) or equal to it (explicit).
          python -I -S scripts/aiven_pg18_diag.py target | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Network probe (DNS families and TCP reachability; categories only)
        env:
          FCB_PG18_TEST_URL: ${{ secrets.FCB_PG18_TEST_URL }}
        run: |
          set -euo pipefail
          python -I -S scripts/aiven_pg18_diag.py probe | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prechecks (database, PostgreSQL 18, TLS, empty schema)
        env:
          FCB_PG18_TEST_URL: ${{ secrets.FCB_PG18_TEST_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          # libpq stderr can contain the server host/IP, so it is never printed raw. On failure a
          # fixed category plus the message with host, IP, port, user, password and database name
          # replaced by placeholders is written to stderr (command substitution cannot swallow it).
          classify() {
            local f="$1"
            if grep -qiE 'password authentication failed' "$f"; then echo auth_failed
            elif grep -qiE 'could not translate host name|Name or service not known|Temporary failure in name resolution|nodename nor servname' "$f"; then echo dns_resolution_failed
            elif grep -qiE 'invalid URI|invalid connection option|invalid percent-encoded|invalid integer value|invalid port number|unexpected .* in URI|missing "=" after|invalid [a-z_]+ value' "$f"; then echo libpq_rejected_uri
            elif grep -qiE 'timeout expired|timed out' "$f"; then echo connect_timeout
            elif grep -qiE 'Connection refused' "$f"; then echo connection_refused
            elif grep -qiE 'Network is unreachable|No route to host|Cannot assign requested address' "$f"; then echo network_unreachable
            elif grep -qiE 'server closed the connection|Connection reset|could not receive data|could not send data' "$f"; then echo connection_closed
            elif grep -qiE 'no pg_hba.conf entry|not permitted to log in' "$f"; then echo access_rule_rejected
            elif grep -qiE 'database .* does not exist' "$f"; then echo database_missing
            elif grep -qiE 'too many connections|remaining connection slots' "$f"; then echo too_many_connections
            elif grep -qiE 'SSL|certificate|TLS' "$f"; then echo tls_error
            else echo other_error
            fi
          }
          q() {
            local err out
            err="$(mktemp)"
            if out="$("$PSQL" "$FCB_PG18_TEST_URL" -X -A -t -v ON_ERROR_STOP=1 -c "$1" 2>"$err")"; then
              rm -f "$err"; printf '%s\n' "$out"
            else
              echo "::error::precheck query failed ($(classify "$err"))" >&2
              echo "libpq (sanitized): $(python -I -S scripts/aiven_pg18_diag.py sanitize "$err")" >&2
              rm -f "$err"; return 1
            fi
          }
          db="$(q 'select current_database()')"
          test "$db" = "$EXPECTED_DB" || { echo "::error::wrong database"; exit 1; }
          ver="$(q "select current_setting('server_version_num')::int")"
          [ "$ver" -ge 180000 ] && [ "$ver" -lt 190000 ] || { echo "::error::server is not PostgreSQL 18"; exit 1; }
          ssl="$(q 'select ssl from pg_stat_ssl where pid = pg_backend_pid()')"
          test "$ssl" = "t" || { echo "::error::connection is not TLS"; exit 1; }
          tls="$(q 'select version || $$ $$ || cipher from pg_stat_ssl where pid = pg_backend_pid()')"
          objects="$(q "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema','pg_toast','_avnadmin_monitor') and n.nspname not like 'pg_temp%' and n.nspname not like 'pg_toast_temp%' and c.relkind in ('r','p','v','m','S','f')")"
          funcs="$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname not in ('pg_catalog','information_schema','_avnadmin_monitor')")"
          # Aiven installs its own monitoring schema (_avnadmin_monitor, owned by postgres) in every
          # database; it is excluded by exact name only. Any other non-system schema besides public
          # makes the precheck fail.
          schemas="$(q "select count(*) from pg_namespace where nspname not in ('public','pg_catalog','information_schema','pg_toast','_avnadmin_monitor') and nspname not like 'pg_temp%' and nspname not like 'pg_toast_temp%'")"
          if [ "$schemas" != "0" ]; then
            echo "::error::unexpected non-system schemas present ($schemas); refusing to run"; exit 1
          fi
          if [ "$objects" != "0" ] || [ "$funcs" != "0" ]; then
            echo "::error::database is not empty (relations=$objects functions=$funcs); refusing to run"; exit 1
          fi
          {
            echo "## Prechecks: PASS"
            echo "- current_database: $db"
            echo "- server_version_num: $ver"
            echo "- TLS: $tls"
            echo "- pre-existing relations/functions: 0/0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose mode - stop before any write
        if: ${{ inputs.mode != 'apply' }}
        run: |
          echo "## Mode: diagnose - prechecks only, the apply step is skipped (no writes)" >> "$GITHUB_STEP_SUMMARY"
          echo "diagnose mode: apply step skipped, no database writes"

      - name: Apply 0001-0007 twice (single transaction, ON_ERROR_STOP) and verify
        # Writes only with an explicit mode=apply; any other value (including empty) skips it.
        if: ${{ inputs.mode == 'apply' }}
        env:
          FCB_PG18_TEST_URL: ${{ secrets.FCB_PG18_TEST_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/18/bin/psql
          # Same-session, same-transaction guard: the apply connection itself must be fcb_pg18_test,
          # PostgreSQL 18 and TLS, otherwise the transaction aborts before any migration statement.
          GUARD="DO \$guard\$ BEGIN IF current_database() <> '$EXPECTED_DB' OR current_setting('server_version_num')::int NOT BETWEEN 180000 AND 189999 OR NOT COALESCE((SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()), false) THEN RAISE EXCEPTION 'FCB_TARGET_GUARD_FAILED'; END IF; END \$guard\$"
          # psql stderr is captured and printed only in sanitized form (no host/IP/credentials).
          sp() {
            local err rc=0
            err="$(mktemp)"
            "$PSQL" "$FCB_PG18_TEST_URL" "$@" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::psql failed (exit $rc)" >&2
              echo "psql (sanitized): $(python -I -S scripts/aiven_pg18_diag.py sanitize "$err")" >&2
            fi
            rm -f "$err"; return "$rc"
          }
          run() { sp -X -q -v ON_ERROR_STOP=1 -1 -c "$GUARD" -f "$SCRIPT" >/dev/null; }
          verify() { sp -X -A -t -F '=' -v ON_ERROR_STOP=1 -f sql/aiven/verify_schema.sql; }
          run;    first="$(verify)"
          applied1="$(sp -X -A -t -c 'select string_agg(applied_at::text, $$,$$ order by version) from schema_migrations')"
          run;    second="$(verify)"
          applied2="$(sp -X -A -t -c 'select string_agg(applied_at::text, $$,$$ order by version) from schema_migrations')"
          test "$first" = "$second" || { echo "::error::second run changed the schema evidence"; exit 1; }
          test "$applied1" = "$applied2" || { echo "::error::second run re-applied migrations"; exit 1; }
          expected="$(printf '%s\n' tables=29 functions=4 triggers=9 indexes=54 constraints_information_schema=307 constraints_pg_constraint=61 schema_migrations_rows=7)"
          counts="$(printf '%s\n' "$second" | head -n 7)"
          test "$counts" = "$expected" || { echo "::error::object counts differ from expected"; printf '%s\n' "$counts"; exit 1; }
          files="$(for f in sql/migrations/bridge/000[1-7]_*.sql; do n="$(basename "$f")"; echo "$((10#${n:0:4}))=$n=$(sha256sum "$f" | cut -d' ' -f1)"; done)"
          recorded="$(printf '%s\n' "$second" | tail -n +8)"
          test "$recorded" = "$files" || { echo "::error::recorded migration checksums differ from repo files"; exit 1; }
          {
            echo "## Apply: PASS (run 1 applied, run 2 no-op)"
            echo '```'
            printf '%s\n' "$second"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
