name: SX Bet Toronto (testnet) certification
# Manual only, from main only, in the protected GitHub Environment `sxbet-toronto` (required reviewer: owner,
# admin bypass OFF, deployment branch main). Issue #187 S8.2, governance §2.6.
# TODAY: preflight only (public Toronto metadata + Environment VARIABLES); no secret, no key, no signature,
# no order. The send job always refuses (SEND_PATH_NOT_ENABLED_PENDING_OWNER_GO) until the owner's GO and a
# separate, reviewed change implement it; even then it needs BOTH the explicit dispatch input and the
# Environment variable SXBET_TORONTO_ORDERS_ENABLED == 'true'. Mainnet is unreachable: the only host in the
# code path is api.toronto.sx.bet (signer/toronto_sender.py, pinned).
on:
  workflow_dispatch:
    inputs:
      send_orders:
        description: "Type exactly: SEND TESTNET ORDERS (refused today: no GO)"
        required: false
        default: "no"
permissions:
  contents: read
  actions: read
concurrency:
  group: sxbet-toronto-certification
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    environment: sxbet-toronto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready_for_send: ${{ steps.ready.outputs.ready_for_send }}
    env:
      PYTHONPATH: .
      SXBET_SIGNER_PROCESS: "1"
      SXBET_TORONTO_MAKER_ADDRESS: ${{ vars.SXBET_TORONTO_MAKER_ADDRESS }}
      SXBET_LIVE_MAKER_ADDRESS: ${{ vars.SXBET_LIVE_MAKER_ADDRESS }}
      SXBET_OWNER_ED25519_PUBLIC_KEY_HEX: ${{ vars.SXBET_OWNER_ED25519_PUBLIC_KEY_HEX }}
      SXBET_TORONTO_RISK_CONFIG_B64: ${{ vars.SXBET_TORONTO_RISK_CONFIG_B64 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a protected environment and a trusted owner dispatch from main (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" sxbet-toronto)"
          echo "## Gate: environment sxbet-toronto protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (signer extras for the risk-config check)
        run: python -m pip install -r requirements.txt cryptography
      - name: Toronto preflight (read-only, no secret; exit 0 only when every check PASSes)
        run: python scripts/sxbet_toronto_certification.py --output "$RUNNER_TEMP/toronto_preflight.json"
      - name: Export ready_for_send (true only from a complete, all-PASS preflight)
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          ready="$(python -c 'import json,sys; r=json.load(open(sys.argv[1])); print("true" if r.get("ready_for_send") is True and all(v.get("outcome")=="PASS" for v in r["results"].values()) else "false")' "$RUNNER_TEMP/toronto_preflight.json")"
          echo "ready_for_send=$ready" >> "$GITHUB_OUTPUT"
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/toronto_preflight.json" ]; then
            { echo '### SX Bet Toronto preflight (testnet, no order)'; echo '```json'; cat "$RUNNER_TEMP/toronto_preflight.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
  send:
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.send_orders == 'SEND TESTNET ORDERS' &&
      vars.SXBET_TORONTO_ORDERS_ENABLED == 'true' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.ready_for_send == 'true'
    environment: sxbet-toronto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      SXBET_SIGNER_PROCESS: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a protected environment and a trusted owner dispatch from main (G-02), else refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/require_owner_main_dispatch.sh
          reviewers="$(bash scripts/require_protected_environment.sh "$REPO" sxbet-toronto)"
          echo "## Gate: environment sxbet-toronto protected (required reviewers: $reviewers), owner dispatch from main" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refused until the owner's GO (no secret is passed to this job)
        run: python scripts/sxbet_toronto_certification.py --send --output "$RUNNER_TEMP/unused.json"
