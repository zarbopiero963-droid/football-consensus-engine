name: fcb-global-e2e-one-command
on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: 'SHA actually observed on the Render LIVE deployment'
        required: true
        type: string
      authorize_live_probe:
        description: 'Explicitly allow bounded real API-FOOTBALL provider probes'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fcb-global-e2e-audit
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: api-football-live
    env:
      PYTHONPATH: .
      APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
      APIFOOTBALL_LIVE_AUTHORIZED: ${{ inputs.authorize_live_probe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded real provider probes (not a substitute for authenticated MCP E2E)
        if: ${{ inputs.authorize_live_probe }}
        continue-on-error: true
        run: |
          python -m pip install httpx
          python scripts/run_real_mcp_probe.py --out /tmp/fcb-real-provider
      - name: Authenticated real MCP protocol and safe tool calls
        if: ${{ inputs.authorize_live_probe }}
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          python scripts/run_authenticated_mcp_e2e.py --out /tmp/fcb-real-mcp.json
      - name: Run entire offline and E2E certification gate
        env:
          PYTHONPATH: .
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q tests/test_global_mcp_certification.py tests/test_mcp_connected_inventory.py tests/test_mcp_tool_evidence_gate.py tests/test_full_mcp_one_command.py
          python scripts/run_full_mcp_certification.py --deployed-sha "$DEPLOYED_SHA" --evidence-dir evidence/certification
      - name: Authenticated MCP evidence integrity digest
        if: always()
        run: |
          if test -f /tmp/fcb-real-mcp.json; then sha256sum /tmp/fcb-real-mcp.json; fi
      - name: Provider evidence integrity digest
        if: always()
        run: |
          if test -f /tmp/fcb-real-provider/provider_samples.json; then
            sha256sum /tmp/fcb-real-provider/provider_samples.json
          fi
      - name: Print manifest SHA even on failure
        if: always()
        run: |
          if test -f /tmp/fcb-global-e2e-result.json; then
            sha256sum /tmp/fcb-global-e2e-result.json
            cat /tmp/fcb-global-e2e-result.json
          fi
